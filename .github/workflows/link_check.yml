name: Link Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - name: Build site
        run: hugo

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}/public"
            --base-url https://webcodr.io
            --exclude-all-private
            --max-retries 3
            --accept 200..=299,403,429
            'public/**/*.html'
          output: ./lychee/out.md
          fail: false

      - name: Find existing link-rot issue
        if: steps.lychee.outputs.exit_code != 0
        id: existing
        uses: micalevisk/last-issue-action@010dfff63530f63c7a9fd54211bde51cc38cff73 # v2.4.0
        with:
          state: open
          labels: link-rot

      - name: Create or update issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Link check report"
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.existing.outputs.issue-number }}
          labels: link-rot
